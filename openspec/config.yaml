schema: spec-driven

context: |
  This is the frontend for ../backend-poker-timer, which owns the API, the contracts package
  (@pstephenwille/poker-timer-contracts) and its own openspec change, add-mvp-backend.
  Use the domain terms in GLOSSARY.md, and US spelling and wording (honors, color, checked).
  Design decisions are numbered in docs/handoff-backend-integration.md; cite them by number.
  A design question is asked one at a time, with a recommended answer, and recorded as soon as answered.

rules:
  tasks:
    - One task is one branch and one PR, built test-first, passing pnpm test, pnpm lint and pnpm build
    - Say whether a task needs a backend change or a contracts release

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always state what is out of scope
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
